<!DOCTYPE html>
<html>
<head>
  <title>AISA Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="attendance.html">Attendance</a>
</div>

<!-- Main Container -->
<div class="container">

  <h2>AISA VOLUNTEERING ATTENDANCE SYSTEM</h2>

  <!-- Inputs -->
  <input type="text" id="prn" placeholder="Enter PRN">
  <input type="date" id="date">
  <input type="text" id="time" placeholder="Enter time">

  <!-- SLOT with radio buttons --> 
  <p><b>SLOT</b></p>
  <div class="row">
    <label>
      <input type="radio" name="slot" value="Lecture" onclick="setType(this.value)"> Lecture
    </label>
    <label>
      <input type="radio" name="slot" value="Lab" onclick="setType(this.value)"> Lab
    </label>
  </div>

  <!-- Faculty Buttons -->
  <p><b>Faculty</b></p>
  <div class="row">
    <button onclick="setFaculty(this,'DDM')">DDM</button>
    <button onclick="setFaculty(this,'SJT')">SJT</button>
    <button onclick="setFaculty(this,'MMB')">MMB</button>
  </div>
  <div class="row">
    <button onclick="setFaculty(this,'SDR')">SDR</button>
    <button onclick="setFaculty(this,'VBS')">VBS</button>
    <button onclick="setFaculty(this,'PAA')">PAA</button>
  </div>
  <div class="row">
    <button onclick="setFaculty(this,'DMK')">DMK</button>
    <button onclick="setFaculty(this,'VRK')">VRK</button>
    <button onclick="setFaculty(this,'AGS')">AGS</button>
  </div>

  <!-- Work Dropdown -->
  <p><b>Work</b></p>
  <select id="work">
    <option value="">Select Work</option>
    <option value="Campaigning">Campaigning</option>
    <option value="Decoration">Decoration</option>
    <option value="Technical Work">Technical Work</option>
  </select>

  <!-- Submit -->
  <button class="submit" onclick="markAttendance()">Submit</button>

  <!-- Result Display -->
  <div id="result"></div>

</div>

<script src="main.js"></script>
</body>
</html>
